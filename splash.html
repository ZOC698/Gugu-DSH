<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>咕嘎 DSH</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; color: #fff9ef; background: radial-gradient(circle at 55% 35%, #3c403a 0%, #252724 44%, #171815 100%); }
      body::before { content: ""; position: fixed; inset: -30%; opacity: .24; background: repeating-linear-gradient(115deg, transparent 0 28px, rgba(255,255,255,.035) 29px 30px); animation: drift 18s linear infinite; }
      main { position: relative; display: grid; grid-template-columns: 190px minmax(300px, 430px); align-items: center; width: min(720px, calc(100vw - 64px)); min-height: 330px; padding: 34px 42px 34px 24px; border: 1px solid rgba(255,255,255,.1); border-radius: 30px; background: rgba(38,40,36,.9); box-shadow: 0 30px 100px rgba(0,0,0,.52), inset 0 1px rgba(255,255,255,.05); }
      .pet { width: 184px; max-height: 260px; object-fit: contain; align-self: end; transform-origin: 50% 100%; animation: bob 2.2s ease-in-out infinite; filter: drop-shadow(0 16px 18px rgba(0,0,0,.4)); }
      .content { padding-left: 22px; }
      .eyebrow { display: flex; align-items: center; gap: 8px; color: #c8c9c2; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #27c5d2; box-shadow: 0 0 14px rgba(39,197,210,.85); }
      h1 { margin: 18px 0 12px; font-size: 28px; line-height: 1.25; font-weight: 760; letter-spacing: -.02em; }
      p { min-height: 48px; margin: 0; color: #bfc0ba; font-size: 13px; line-height: 1.8; white-space: pre-wrap; }
      .progress { position: relative; width: 100%; height: 9px; margin-top: 26px; overflow: hidden; border-radius: 999px; background: #151613; border: 1px solid rgba(255,255,255,.08); }
      .progress::after { content: ""; position: absolute; inset: 1px; width: 36%; border-radius: inherit; background: linear-gradient(90deg, #f5a316, #ffd16a); animation: load 1.5s ease-in-out infinite; }
      form { display: none; margin-top: 20px; }
      form.active { display: grid; gap: 12px; }
      input { width: 100%; padding: 11px 13px; color: #fff9ef; background: #171815; border: 1px solid rgba(255,255,255,.16); border-radius: 10px; outline: none; font: inherit; }
      input:focus { border-color: #27c5d2; box-shadow: 0 0 0 3px rgba(39,197,210,.14); }
      .actions { display: flex; justify-content: flex-end; gap: 9px; }
      button { padding: 9px 15px; border: 0; border-radius: 9px; color: #20221f; background: #ffd16a; font: inherit; font-weight: 700; cursor: pointer; }
      button.secondary { color: #dcddd7; background: #3a3c37; }
      body.connect-mode .progress { display: none; }
      .beak { position: absolute; right: 45px; top: 34px; width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 18px solid #f5a316; filter: drop-shadow(0 4px 3px rgba(0,0,0,.25)); }
      @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-8px) rotate(1deg); } }
      @keyframes load { 0% { transform: translateX(-110%); } 55%,100% { transform: translateX(300%); } }
      @keyframes drift { to { transform: translate3d(80px, 40px, 0); } }
      @media (max-width: 650px) { main { grid-template-columns: 120px 1fr; padding: 26px 28px 26px 12px; } .pet { width: 130px; } }
    </style>
  </head>
  <body>
    <main>
      <img class="pet" src="assets/gugu-cutout.png" alt="咕嘎">
      <section class="content">
        <div class="eyebrow"><i class="dot"></i> GUGU · DSH</div>
        <h1 id="message">咕嘎正在连接工作台…</h1>
        <p id="detail">优先接入你正在使用的 3080 WebUI。</p>
        <div class="progress" aria-hidden="true"></div>
        <form id="connect-form">
          <input id="address" name="address" type="text" inputmode="url" spellcheck="false" autocomplete="off" aria-label="DSH WebUI 地址">
          <div class="actions">
            <button class="secondary" id="cancel" type="button">自动连接</button>
            <button type="submit">连接</button>
          </div>
        </form>
      </section>
      <i class="beak" aria-hidden="true"></i>
    </main>
    <script>
      const query = new URLSearchParams(location.search)
      document.querySelector('#message').textContent = query.get('message') || '咕嘎正在连接工作台…'
      document.querySelector('#detail').textContent = query.get('detail') || '优先接入你正在使用的 3080 WebUI。'
      if (query.get('mode') === 'connect') {
        document.body.classList.add('connect-mode')
        const form = document.querySelector('#connect-form')
        const address = document.querySelector('#address')
        form.classList.add('active')
        address.value = query.get('address') || 'http://127.0.0.1:3080'
        address.focus()
        address.select()
        form.addEventListener('submit', event => {
          event.preventDefault()
          location.href = `gugu-dsh://connect?url=${encodeURIComponent(address.value)}`
        })
        document.querySelector('#cancel').addEventListener('click', () => {
          location.href = 'gugu-dsh://cancel'
        })
      }
    </script>
  </body>
</html>
